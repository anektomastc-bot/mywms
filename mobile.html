<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8720c">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<link rel="apple-touch-icon" href="images/logo.svg">
<link rel="shortcut icon" href="images/logo.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CONST-WMS Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --orange:#e8720c;--orange2:#c2570a;--orange-grad:linear-gradient(135deg,#f0872a,#e8720c);
  --bg:#f4f2ee;--card:#ffffff;--ink:#1f2937;--sub:#6b7280;--sub2:#9ca3af;
  --line:#e7e1d6;--line2:#efeae1;--soft:#faf8f4;
  --ok:#22c55e;--okbg:#eafaf0;--danger:#ef4444;--warn:#f59e0b;--info:#0ea5e9;
  --shadow:0 2px 12px rgba(30,30,20,.06);--shadow2:0 8px 30px rgba(30,30,20,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{font-family:inherit;-webkit-user-select:text;user-select:text}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}

/* ── Top bar ── */
.top{position:sticky;top:0;z-index:40;background:#241f18;border-bottom:none;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px}
.top .logo{width:34px;height:34px;border-radius:10px;background:#000;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.top .logo svg{width:20px;height:20px;stroke:#fff}
.top .tt{flex:1;min-width:0;overflow:hidden}
.top .tt b{font-size:15px;font-weight:800;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.top .tt span{font-size:11px;color:rgba(255,255,255,.55);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .co{font-size:10px;font-weight:700;background:var(--orange);color:#fff;padding:3px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto;max-width:110px;overflow:hidden;text-overflow:ellipsis}

/* ── Screen area ── */
.screen{padding:16px 16px 96px;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h1{font-size:22px;font-weight:900;margin-bottom:2px}
.sub{font-size:13px;color:var(--sub);margin-bottom:16px}
.sec-t{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:20px 4px 10px}

/* ── Cards / stats ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:rgba(255,255,255,.6);border:1px solid var(--line2);border-radius:18px;padding:16px;box-shadow:0 1px 6px rgba(30,30,20,.04);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .1s}
.stat:active{transform:scale(.97)}
.stat .stat-top{display:flex;align-items:center;gap:11px}
.stat .ic{width:36px;height:36px;border-radius:11px;background:rgba(232,114,12,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stat .ic svg{width:19px;height:19px;stroke:var(--orange)}
.stat .v{font-size:27px;font-weight:900;line-height:1;color:var(--ink)}
.stat .l{font-size:12.5px;color:var(--sub);margin-top:10px;font-weight:600}
.stat .go{margin-left:auto;color:var(--sub2)}
.stat .go svg{width:16px;height:16px;stroke:currentColor}
/* dark hero home */
.hero{margin:-16px -16px 14px;padding:calc(env(safe-area-inset-top) + 6px) 18px 24px;background:linear-gradient(160deg,#241f18 0%,#332a20 55%,#4a3a28 100%);border-radius:0 0 26px 26px;color:#fff;position:relative;box-shadow:0 6px 20px rgba(30,20,10,.18)}
.hero-date{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:18px;font-size:12px;color:rgba(255,255,255,.5);text-align:right;line-height:1.5;font-weight:600}
.hero-greet{font-size:14px;font-weight:700;display:inline-block;background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,#f6c177 45%,#ffe6c0 55%,rgba(255,255,255,.4) 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:greetShimmer 3.2s linear infinite}
@keyframes greetShimmer{0%{background-position:120% center}100%{background-position:-120% center}}
.hero-name{animation:heroIn .5s ease both}
@keyframes heroIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hero-name{font-size:25px;font-weight:900;color:#fff;margin-top:3px;line-height:1.15}
.hero-stats{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:18px;margin-top:18px;overflow:hidden;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hstat{flex:1;text-align:center;padding:15px 4px}
.hstat+.hstat{border-left:1px solid rgba(255,255,255,.08)}
.hstat .hv{font-size:23px;font-weight:900;color:#fff;line-height:1}
.hstat .hv.warn{color:#f5a623}
.hstat .hl{font-size:11px;color:rgba(255,255,255,.6);margin-top:5px}
.hstat:active{background:rgba(255,255,255,.06)}
.bic{width:15px;height:15px;vertical-align:-3px;margin-right:3px;flex:0 0 auto}
.hbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--sub);font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hbtn.del{color:var(--danger)}
.hbtn:active{transform:scale(.92)}

/* list row */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row .rt{flex:1;min-width:0}
.row .rt b{font-size:14.5px;font-weight:700;display:block}
.row .rt small{font-size:12px;color:var(--sub)}
.row .rv{font-weight:800;font-size:15px;text-align:right}
.thumb{width:44px;height:44px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.thumb svg{width:22px;height:22px;stroke:var(--sub)}
.thumb img{width:100%;height:100%;object-fit:cover}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okbg);color:#16a34a}
.pill.warn{background:#fff7ed;color:#c2570a}
.pill.info{background:#e0f2fe;color:#0284c7}
.pill.ng{background:#f3f4f6;color:#6b7280}

.progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--orange-grad);border-radius:6px}

.qa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:4px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow)}
.qa button svg{width:24px;height:24px;stroke:var(--orange)}
.qa button span{font-size:12px;font-weight:700}
.qa button:active{transform:scale(.96)}

.inp{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;line-height:1.5;background:var(--card);color:var(--ink);outline:none}
select.inp{min-height:46px;line-height:1.5}
.inp:focus{border-color:var(--orange)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:6px}
.btn{width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--orange-grad);color:#fff;box-shadow:0 6px 18px rgba(232,114,12,.3)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:linear-gradient(135deg,#4ade80,#22c55e);color:#fff}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.btn svg{width:20px;height:20px}

/* ── Bottom nav ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:45;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:flex-end;
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub2);font-size:10.5px;font-weight:600;padding:4px 0}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--orange)}
.nav .scanbtn{flex:0 0 auto;margin-top:-34px}
.nav .scanbtn .circle{width:68px;height:68px;border-radius:50%;background:var(--orange-grad);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 8px 22px rgba(232,114,12,.45);border:4px solid var(--card);transition:transform .1s}
.nav .scanbtn .circle svg{width:26px;height:26px;stroke:#fff}
.nav .scanbtn .circle span{font-size:9px;font-weight:800;color:#fff}
.nav .scanbtn:active .circle,.nav .scanbtn.holding .circle{transform:scale(.9);box-shadow:0 4px 12px rgba(232,114,12,.5)}

/* ── Login / PIN ── */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;background:linear-gradient(160deg,#fff,#faf6f0)}
.boot-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.boot-logo{animation:bootPulse 1.7s ease-in-out infinite}
.boot-logo .lg,.boot-logo svg{filter:drop-shadow(0 8px 22px rgba(249,115,22,.28))}
@keyframes bootPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.boot-boxes{display:flex;gap:8px;margin-top:8px}
.boot-boxes span{width:13px;height:13px;border-radius:3px;background:var(--orange);box-shadow:0 3px 8px rgba(249,115,22,.3);animation:bootBox 1s ease-in-out infinite}
.boot-boxes span:nth-child(2){animation-delay:.15s;background:#f59e0b}
.boot-boxes span:nth-child(3){animation-delay:.3s;background:#fb923c}
@keyframes bootBox{0%,100%{transform:translateY(0) rotate(0);opacity:.45}40%{transform:translateY(-13px) rotate(8deg);opacity:1}}
.boot-bar{width:190px;height:5px;border-radius:5px;background:rgba(0,0,0,.07);overflow:hidden;margin-top:6px;position:relative}
.boot-bar i{position:absolute;left:0;top:0;width:42%;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--orange),#fb923c);animation:bootSlide 1.25s cubic-bezier(.65,0,.35,1) infinite}
@keyframes bootSlide{0%{left:-45%}100%{left:105%}}
.boot-msg{font-size:13px;color:var(--sub);margin-top:4px;letter-spacing:.2px;animation:bootFade 1.6s ease-in-out infinite}
@keyframes bootFade{0%,100%{opacity:.55}50%{opacity:1}}
.auth .brand{text-align:center;margin-bottom:34px}
.auth .brand .lg{width:76px;height:76px;border-radius:22px;background:#000;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.auth .brand .lg svg{width:40px;height:40px;stroke:#fff}
.auth .brand h1{font-size:26px;font-weight:900}
.auth .brand p{font-size:13px;color:var(--sub);margin-top:2px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.pinpad button{aspect-ratio:1.5;border-radius:16px;background:var(--card);border:1.5px solid var(--line);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.pinpad button:active{background:var(--soft);transform:scale(.95)}
.pinpad button.act{color:var(--orange)}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:20px 0}
.pin-dots .d{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);transition:.2s}
.pin-dots .d.on{background:var(--orange);border-color:var(--orange);transform:scale(1.15)}
.pin-dots.err .d{border-color:var(--danger);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── Scan overlay ── */
.scan-ov{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
.scan-ov.show{display:flex}
#reader{width:100%;max-width:520px}
#reader video{object-fit:cover!important}
.scan-frame{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:min(92vw,400px);height:min(64vw,300px);border:3px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:0 0 0 100vmax rgba(0,0,0,.4);pointer-events:none;z-index:2}
/* ซ่อนกรอบ/เงาที่ html5-qrcode วาดเอง ให้เหลือกรอบส้มอันเดียว */
#reader{border:0 !important;background:transparent !important}
#reader__scan_region{border:0 !important;box-shadow:none !important;background:transparent !important}
#reader__scan_region > div{display:none !important}
#reader__scan_region img{display:none !important}
#reader video{display:block !important;width:100% !important;height:100% !important;object-fit:cover}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;width:36px;height:36px;border:4px solid var(--orange)}
.scan-frame::before{top:-3px;left:-3px;border-right:none;border-bottom:none;border-radius:12px 0 0 0}
.scan-frame::after{bottom:-3px;right:-3px;border-left:none;border-top:none;border-radius:0 0 12px 0}
.scan-hint{position:absolute;bottom:64px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.scan-hint small{display:block;opacity:.8;font-weight:500;font-size:12px;margin-top:4px}

/* ── Sheet ── */
.sheet-ov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:none;align-items:flex-end;animation:fade .2s}
.sheet-ov.show{display:flex}
.sheet{position:relative;width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);max-height:88vh;overflow:auto;animation:up .25s}
.sheet-x{position:absolute;top:12px;right:14px;z-index:6;width:32px;height:32px;border-radius:50%;background:var(--soft);border:1px solid var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;line-height:1;padding:0}
.sheet-x:active{transform:scale(.9);background:#eee}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 16px}
.sheet .sh-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet .sh-h .thumb{width:52px;height:52px}
.sheet .sh-h b{font-size:17px;font-weight:800;display:block}
.sheet .sh-h small{font-size:12.5px;color:var(--sub)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:15px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.opt:active{background:var(--soft)}
.opt .oi{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.opt .oi svg{width:22px;height:22px;stroke:#fff}
.opt.rcv .oi{background:linear-gradient(135deg,#4ade80,#22c55e)}
.opt.iss .oi{background:linear-gradient(135deg,#fb923c,#e8720c)}
.opt.trf .oi{background:linear-gradient(135deg,#38bdf8,#0284c7)}
.opt b{font-size:15px;font-weight:800;display:block}
.opt small{font-size:12px;color:var(--sub)}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:200;background:#1f2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow2);max-width:88%;text-align:center;animation:fade .2s}
.toast.err{background:#dc2626}.toast.ok{background:#16a34a}

.search{position:relative;margin-bottom:14px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--sub)}
.search input{padding-left:42px}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chips button{white-space:nowrap;padding:7px 15px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--sub)}
.chips button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.stk-type{overflow:visible;padding-bottom:0}
.stk-type button{padding:9px 11px;font-size:12px;border-radius:12px}
.lang{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:20px;padding:3px}
.lang button{padding:6px 14px;border-radius:18px;font-size:12px;font-weight:700;color:rgba(255,255,255,.7)}
.lang button.on{background:var(--orange);color:#fff}
.topsync{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-right:2px}
.topsync svg{width:16px;height:16px}
.topsync:active{background:var(--soft)}
@keyframes tspin{to{transform:rotate(360deg)}}
.topsync.spin svg{animation:tspin .7s linear infinite}
/* round scan button inside picker */
.scan-foot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0 4px;position:sticky;bottom:0;background:linear-gradient(to top,var(--card) 72%,rgba(255,255,255,0))}
.scan-round{background:none}
.scan-round .circle{width:72px;height:72px;border-radius:50%;background:var(--orange-grad);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 8px 22px rgba(232,114,12,.45);transition:transform .1s}
.scan-round .circle svg{width:28px;height:28px;stroke:#fff}
.scan-round .circle span{font-size:9px;font-weight:800;color:#fff}
.scan-round.holding .circle{transform:scale(.9);box-shadow:0 4px 12px rgba(232,114,12,.5)}
.scan-row{display:flex;align-items:center;justify-content:center;gap:26px;width:100%}
.pick-spacer{width:52px;height:52px;flex:0 0 auto}
.pick-home{width:52px;height:52px;flex:0 0 auto;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.pick-home:active{background:#eee;transform:scale(.94)}
.pick-home svg{width:22px;height:22px}
.scan-lbl{font-size:12px;color:var(--sub);font-weight:600}
.locscan{width:46px;flex:0 0 auto;border-radius:12px;background:var(--orange-grad);color:#fff;display:flex;align-items:center;justify-content:center;border:none}
.locscan svg{width:20px;height:20px;stroke:#fff}
.locscan:active{transform:scale(.94)}
.backbtn{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--orange);margin-bottom:10px}

@keyframes __fadeIn{from{opacity:0}to{opacity:1}}
@keyframes __pop{0%{opacity:0;transform:scale(.85)}55%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
.ui-dlg-ov{position:fixed;inset:0;z-index:100001;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:22px;animation:__fadeIn .15s ease}
.ui-dlg{background:#fff;border-radius:18px;max-width:400px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.32);overflow:hidden;animation:__pop .25s cubic-bezier(.22,1,.36,1)}
.ui-dlg-h{display:flex;align-items:center;gap:12px;padding:18px 20px 2px;font-size:16px;font-weight:800;color:var(--ink,#1f2937)}
.ui-dlg-ic{width:40px;height:40px;border-radius:12px;background:rgba(232,114,12,.12);color:var(--orange,#e8720c);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ui-dlg-ic svg{width:22px;height:22px}
.ui-dlg-b{padding:10px 20px 4px;font-size:14.5px;line-height:1.55;color:var(--ink,#1f2937)}
.ui-dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px 18px}
.ui-dlg-f .btn{width:auto;min-width:82px}
</style>
</head>
<body>

<script>
/* ═══════════════════════════════════════════════════════════
   CONST-WMS Mobile — ใช้ข้อมูลชุดเดียวกับเว็บหลัก
   ───────────────────────────────────────────────────────────
   ⬇️ ตั้งค่าเชื่อมต่อ Google Sheets ตรงนี้ได้เลย (ทำครั้งเดียว)
      ใส่ Web App URL (ลงท้าย /exec) + Secret Key ให้ตรงกับ Code.gs
      เว้นว่างไว้ก็ได้ ถ้าจะเปิดผ่านลิงก์/QR จากเว็บหลัก หรือกดปุ่ม
      "ตั้งค่าเซิร์ฟเวอร์" ในแอปแทน
   ═══════════════════════════════════════════════════════════ */
window.GS_URL = window.GS_URL || "";                       // เช่น https://script.google.com/macros/s/XXXX/exec
window.GS_KEY = window.GS_KEY || "CONSTRUCT_SECRET_2026";   // ต้องตรงกับ API_KEY ใน Code.gs

var DB_KEY="construct_wms_v1", SESS_KEY="_wms_session", LANG=localStorage.getItem("construct_lang")||"th";
var META=null, DB=null, session={user:null,company:null};
// Backend URL: รองรับทั้ง Google Apps Script (/exec) และ PHP (api.php)
// ลำดับความสำคัญ: window.GS_URL (ตั้งในไฟล์นี้) → localStorage → PHP fallback
var PHP_API=window.GS_URL||localStorage.getItem("_wms_gs_url")||localStorage.getItem("_wms_api_url")||(location.origin+location.pathname.replace(/[^\/]*$/,"")+"api_supabase.php");
var PHP_TOKEN=window.GS_KEY||localStorage.getItem("_wms_gs_key")||localStorage.getItem("_wms_api_token")||"CONSTRUCT_SECRET_2026";
var _connErr=""; // เก็บสาเหตุที่เชื่อมต่อไม่ได้ล่าสุด (ไว้แสดงบนจอ)
function isGS(){ return /script\.google\.com/.test(PHP_API); }
// ส่ง key/token เป็น query param (Apps Script อ่าน custom header ไม่ได้) + text/plain เลี่ยง CORS preflight
function apiUrl(action){ return PHP_API+"?action="+action+"&key="+encodeURIComponent(PHP_TOKEN)+"&token="+encodeURIComponent(PHP_TOKEN); }
function apiHeaders(){return {"Content-Type":"text/plain;charset=utf-8"};}
function loadFromServer(){
  _connErr="";
  return fetch(apiUrl("load"),{cache:"no-store"})
    .then(function(r){if(!r.ok){_connErr="HTTP "+r.status;throw 0;}return r.text();})
    .then(function(txt){
      var j; try{j=JSON.parse(txt);}catch(e){ _connErr="ตอบกลับไม่ใช่ JSON (อาจ Deploy ไม่ได้ตั้ง Access=Anyone หรือ URL ผิด)"; return null; }
      if(j&&j.ok===false){ _connErr=j.error||"Unauthorized (Key ไม่ตรงกับ Code.gs)"; return null; }
      return (j&&j.ok)?j.data:((j&&j.companies)?j:null);
    })
    .catch(function(){ if(!_connErr)_connErr="เชื่อมต่อไม่ได้ (เน็ต/URL/CORS)"; return null; });
}
function saveToServer(){
  try{META._savedAt=Date.now();META._savedBy="mobile";
    fetch(apiUrl("save"),{method:"POST",headers:apiHeaders(),body:JSON.stringify(META),cache:"no-store"}).catch(function(){});
  }catch(e){}
}
// ทดสอบการเชื่อมต่อ (ping ไม่ต้องใช้ key)
function testConn(){
  toast(T("กำลังทดสอบ…","Testing…"));
  fetch(apiUrl("ping"),{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(txt){ var j; try{j=JSON.parse(txt);}catch(e){ toast(T("URL ผิด หรือยังไม่ได้ Deploy (Access=Anyone)","Bad URL / not deployed as Anyone"),"err"); return; }
      if(j&&(j.ok||j.pong)){ toast("✅ "+T("เชื่อมต่อได้","Connected")+": "+(j.sheetName||j.server||"OK"),"ok"); boot(); }
      else { toast("❌ "+(j.error||T("เชื่อมต่อไม่สำเร็จ","Failed")),"err"); } })
    .catch(function(){ toast("❌ "+T("เชื่อมต่อไม่ได้ (เน็ต/URL/CORS)","Cannot reach server"),"err"); });
}

function loadMETA(){
  try{ var r=localStorage.getItem(DB_KEY); if(r){var d=JSON.parse(r); if(d&&d.companies){META=d;return true;}} }catch(e){}
  return false;
}
function saveMETA(){ try{ localStorage.setItem(DB_KEY,JSON.stringify(META)); }catch(e){ toast("บันทึกไม่สำเร็จ (พื้นที่เต็ม)","err"); } }
function activateCompany(cid){
  session.company=cid;
  if(!META.partitions) META.partitions={};
  if(!META.partitions[cid]) META.partitions[cid]={itemMaster:[],locationMaster:[],history:[],projects:[],assetMovements:[],purchaseOrders:[],salesOrders:[],stockLedger:[],workers:[],workerJobs:[],boqTemplates:[],boqMasters:[],suppliers:[],repairs:[]};
  DB=META.partitions[cid];
  if(!DB.workerJobs) DB.workerJobs=[];
  ["itemMaster","locationMaster","history","projects","assetMovements","purchaseOrders","salesOrders","stockLedger","workers","boqTemplates"].forEach(function(k){ if(!DB[k])DB[k]=[]; });
}
function mSave(){ META.txnSeq=txnSeq; saveMETA(); saveToServer(); }
var txnSeq=0;

/* ═══ Auto-refresh เงียบๆ ทุก 5 วินาที (ดึงข้อมูลใหม่จาก server ถ้ามีการเปลี่ยนแปลง) ═══ */
var _autoRefreshTimer=null, _lastSyncAt=0, _refreshing=false;
function _isTypingNow(){
  var a=document.activeElement;
  return a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");
}
function silentRefresh(){
  if(_refreshing||!session.company) return;
  // ไม่รีเฟรชระหว่างกำลังกรอกฟอร์ม หรือกล้องสแกนเปิดอยู่ (กันข้อมูลกระตุก)
  if(_isTypingNow()||scanning) return;
  var sheetOpen=document.getElementById("sheet")&&document.getElementById("sheet").classList.contains("show");
  _refreshing=true;
  loadFromServer().then(function(data){
    _refreshing=false;
    if(!data||!data.partitions) return;
    var remoteAt=data._savedAt||0, localAt=META._savedAt||0;
    // server ใหม่กว่า และไม่ใช่ข้อมูลที่เราเพิ่งบันทึกเอง → อัปเดต
    if(remoteAt>localAt && remoteAt!==_lastSyncAt){
      _lastSyncAt=remoteAt;
      var curCompany=session.company;
      META=data; saveMETA();
      if(META.partitions[curCompany]){ activateCompany(curCompany); }
      // รีเฟรชหน้าปัจจุบันแบบไม่รบกวน (ไม่รีเฟรชถ้ามี sheet เปิดอยู่)
      if(!sheetOpen && typeof CUR!=="undefined" && CUR){ try{go(CUR);}catch(e){} }
    }
  }).catch(function(){_refreshing=false;});
}
function startAutoRefresh(){
  if(_autoRefreshTimer) clearInterval(_autoRefreshTimer);
  _autoRefreshTimer=setInterval(silentRefresh,15000); // sync เงียบทุก 15 วิ
}
function stopAutoRefresh(){ if(_autoRefreshTimer){clearInterval(_autoRefreshTimer);_autoRefreshTimer=null;} }
// หยุด refresh เมื่อออกจากแอป, ทำต่อเมื่อกลับมา
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ stopAutoRefresh(); } else { silentRefresh(); startAutoRefresh(); }
});

/* ── helpers ── */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* แปลง URL รูป Drive แบบเก่า → lh3 (ฝังใน <img> ได้จริง) */
function imgSrc(u){ if(!u)return""; u=String(u); var m=/drive\.google\.com\/(?:uc\?(?:export=view&)?id=|open\?id=|file\/d\/)([a-zA-Z0-9_-]+)/.exec(u); return m?("https://lh3.googleusercontent.com/d/"+m[1]):u; }
function num(n){n=parseFloat(n)||0;return n.toLocaleString("en-US",{maximumFractionDigits:2});}
function numK(n){n=parseFloat(n)||0;if(Math.abs(n)>=1000)return (n/1000).toLocaleString("en-US",{maximumFractionDigits:1})+"K";return num(n);}
function today(){return new Date().toISOString().slice(0,10);}
function nowTime(){return new Date().toTimeString().slice(0,5);}
function fmtDate(d){if(!d)return"-";try{var p=String(d).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d;}catch(e){return d;}}
function T(th,en){return LANG==="th"?th:en;}
function getStockQty(code,loc){var r=(DB.stockLedger||[]).find(function(x){return x.code===code&&x.loc===loc;});if(r)return Math.max(0,parseInt(r.qty)||0);var im=(DB.itemMaster||[]).find(function(x){return x.code===code&&x.loc===loc;});return im?Math.max(0,parseInt(im.qty)||0):0;}
function totalStock(code){
  var m={}; (DB.stockLedger||[]).forEach(function(s){if(s.code===code&&s.loc){m[s.loc]=Math.max(0,parseInt(s.qty)||0);}});
  (DB.itemMaster||[]).forEach(function(i){if(i.code===code&&i.loc&&m[i.loc]===undefined){m[i.loc]=Math.max(0,parseInt(i.qty)||0);}});
  return Object.values(m).reduce(function(a,b){return a+b;},0);
}
function locBalances(code){
  var m={},fromL={};
  (DB.stockLedger||[]).forEach(function(s){if(s.code===code&&s.loc){m[s.loc]=(m[s.loc]||0)+Math.max(0,parseInt(s.qty)||0);fromL[s.loc]=1;}});
  (DB.itemMaster||[]).forEach(function(i){if(i.code===code&&i.loc&&!fromL[i.loc]){m[i.loc]=(m[i.loc]||0)+Math.max(0,parseInt(i.qty)||0);}});
  return Object.keys(m).map(function(l){return{loc:l,qty:m[l]};}).filter(function(x){return x.qty>0;});
}
function adjustStockAt(code,loc,delta){
  if(!code||!loc)return;
  if(!DB.stockLedger)DB.stockLedger=[];
  var led=DB.stockLedger.find(function(x){return x.code===code&&x.loc===loc;});
  if(!led){var seed=0;var b=DB.itemMaster.find(function(x){return x.code===code&&x.loc===loc;});if(b)seed=Math.max(0,parseInt(b.qty)||0);if(seed>0||delta>0){led={code:code,loc:loc,qty:seed};DB.stockLedger.push(led);}}
  if(led)led.qty=Math.max(0,(parseInt(led.qty)||0)+delta);
  var im=DB.itemMaster.find(function(x){return x.code===code&&x.loc===loc;});
  if(im){im.qty=led?led.qty:Math.max(0,(parseInt(im.qty)||0)+delta);}
  else if(delta>0){var base=DB.itemMaster.find(function(x){return x.code===code&&!x._isStockPos;})||{};DB.itemMaster.push(Object.assign({},base,{code:code,loc:loc,qty:(led?led.qty:delta),_isStockPos:true}));}
}
function itemByCode(code){return DB.itemMaster.find(function(i){return i.code===code&&!i._isStockPos;});}
function findScanned(txt){
  txt=String(txt||"").trim();
  var it=DB.itemMaster.find(function(i){return !i._isStockPos&&(i.code===txt||i.barcode===txt||i.qr===txt||i.sku===txt);});
  if(it)return it;
  var up=txt.toUpperCase();
  it=DB.itemMaster.find(function(i){return !i._isStockPos&&String(i.code).toUpperCase()===up;});
  if(it)return it;
  return DB.itemMaster.find(function(i){return !i._isStockPos&&(String(i.code).toUpperCase().indexOf(up)>=0||String(i.name||"").toUpperCase().indexOf(up)>=0);});
}
function homeLoc(){
  var u=session.user;
  if(u&&u.warehouse){var l=DB.locationMaster.find(function(x){return x.warehouse===u.warehouse;});if(l)return l.code;}
  var h=DB.locationMaster.find(function(x){return x.code==="HEAD-WH"||x.type==="HEAD";});
  return h?h.code:(DB.locationMaster[0]?DB.locationMaster[0].code:"HEAD-WH");
}
/* ── Scope: ทุก role ยกเว้น Admin/Manager/SuperAdmin เห็นเฉพาะ Warehouse/Project ตนเอง ── */
function isScopeExemptM(){var r=session.user&&session.user.role;return r==="Admin"||r==="Manager"||r==="SuperAdmin";}
function userScopeWH(){
  var u=session.user; if(!u||isScopeExemptM())return null;
  var whs=[];
  if(u.warehouse)whs.push(String(u.warehouse).toUpperCase());
  if(u.scopeProject){var p=(DB.projects||[]).find(function(x){return x.id===u.scopeProject;});if(p&&p.warehouse)whs.push(String(p.warehouse).toUpperCase());}
  return whs.length?whs:null;
}
function inScopeLoc(loc){
  var whs=userScopeWH(); if(!whs)return true;
  var lm=(DB.locationMaster||[]).find(function(l){return l.code===loc;});
  var wh=lm?String(lm.warehouse||"").toUpperCase():String(loc||"").toUpperCase();
  return whs.indexOf(wh)>=0;
}
function inScopeProject(p){
  var u=session.user; if(!u||isScopeExemptM())return true;
  if(u.scopeProject)return p.id===u.scopeProject;
  if(u.warehouse)return String(p.warehouse||"").toUpperCase()===String(u.warehouse).toUpperCase();
  return true;
}
function isProjScopedM(){var u=session.user;return !!(u&&!isScopeExemptM()&&u.scopeProject);}
function userProjIdM(){var u=session.user;return (u&&u.scopeProject)||"";}
/* สินค้าตัวนี้อยู่ในขอบเขต (คลัง/โปรเจค) ของผู้ใช้ไหม */
function itemInScopeM(code){
  var whs=userScopeWH();
  if(!whs)return true;   // Admin/Manager เห็นทุกอย่าง
  var hasWh=(DB.stockLedger||[]).some(function(sl){return sl.code===code&&(sl.qty||0)>0&&inScopeLoc(sl.loc);});
  if(hasWh)return true;
  return (DB.history||[]).some(function(h){return h.code===code&&(inScopeLoc(h.loc)||inScopeLoc(h.toLoc)||inScopeLoc(h.fromLoc));});
}
function scopeLocs(){
  var whs=userScopeWH(); var all=DB.locationMaster.slice();
  if(!whs)return all;
  return all.filter(function(l){return whs.indexOf(String(l.warehouse||"").toUpperCase())>=0;});
}
/* PO อยู่ในขอบเขตของผู้ใช้ไหม (มีสินค้าที่อยู่ในคลัง/โปรเจคของตน หรือผูกโปรเจคของตน) */
function poInScopeM(po){
  if(!userScopeWH())return true;
  if(isProjScopedM()&&(po.projectId===userProjIdM()||po.project===userProjIdM()))return true;
  var items=po.items||[];
  return items.some(function(it){return itemInScopeM(it.code);});
}
/* SO อยู่ในขอบเขตไหม (ผูกโปรเจค/คลังของตน หรือมอบหมายให้ผู้ใช้) */
function soInScopeM(so){
  if(!userScopeWH())return true;
  if(isProjScopedM()&&(so.projectId===userProjIdM()||so.project===userProjIdM()))return true;
  var uname=(session.user&&session.user.fullName)||(session.user&&session.user.username)||"";
  if(so.workers&&String(so.workers).indexOf(uname)>=0)return true;
  var items=so.items||[];
  return items.some(function(it){return itemInScopeM(it.code);});
}
/* งานซ่อมอยู่ในขอบเขตไหม (สินค้าอยู่ในคลังของตน หรือ loc อยู่ในขอบเขต) */
function repairInScopeM(r){
  if(!userScopeWH())return true;
  return itemInScopeM(r.code||r.assetCode)||inScopeLoc(r.loc);
}
function scopeStock(code){
  var whs=userScopeWH();
  if(!whs)return totalStock(code);
  return locBalances(code).filter(function(x){return inScopeLoc(x.loc);}).reduce(function(s,x){return s+x.qty;},0);
}
/* ── สิทธิ์เมนู (ใช้ค่าเดียวกับเว็บ: menuPerms ต่อผู้ใช้ + DB.settings.menus) ── */
function isAdminM(){var r=session.user&&session.user.role;return r==="Admin"||r==="SuperAdmin";}
/* บีบอัดรูป → ≤100KB (ใช้แนบภาพ Asset ซ่อม/ชำรุด) */
function _imgCompressM(file, cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height,MX=800;
      if(w>MX||h>MX){var s=MX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      var q=0.9,dim=Math.max(w,h);
      function tryOut(){
        var data=cv.toDataURL("image/jpeg",q);
        var kb=Math.round((data.length-24)*0.75/1024);
        if(kb<=100||q<=0.35){cb(data,kb);return;}
        q-=0.12;
        if(q<0.5&&dim>420){dim=Math.round(dim*0.82);var s2=dim/Math.max(cv.width,cv.height);
          var w2=Math.round(cv.width*s2),h2=Math.round(cv.height*s2);
          var cv2=document.createElement("canvas");cv2.width=w2;cv2.height=h2;
          cv2.getContext("2d").drawImage(cv,0,0,w2,h2);cv=cv2;q=0.7;}
        tryOut();
      }
      tryOut();
    };
    img.onerror=function(){toast(T("ไฟล์รูปไม่ถูกต้อง","Invalid image"),"err");};
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
/* อัปโหลดรูปสินค้าไป Google Drive (ผ่าน backend) — fallback เป็น base64 ถ้าอัปไม่ได้ */
function _imgUploadM(code,dataUrl,cb){
  var cid=session.company||"global";
  fetch(apiUrl("uploadimg"),{method:"POST",headers:apiHeaders(),
    body:JSON.stringify({cid:cid,code:code,data:dataUrl})})
    .then(function(r){return r.json();}).then(function(j){cb(j&&j.ok&&j.url?j.url:dataUrl);})
    .catch(function(){cb(dataUrl);});
}
/* Admin กดค้างที่รูป → เลือกไฟล์ → บีบอัด <100KB → บันทึก */
function editItemImageM(code){
  if(!isAdminM()){toast(T("เฉพาะ Admin แก้ไขรูปได้","Admin only"),"err");return;}
  var it=itemByCode(code); if(!it){toast(T("ไม่พบสินค้า","Item not found"),"err");return;}
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.style.display="none";
  document.body.appendChild(inp);
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];document.body.removeChild(inp);if(!f)return;
    toast(T("กำลังบีบอัดรูป…","Compressing…"),"info");
    _imgCompressM(f,function(dataUrl,kb){
      _imgUploadM(code,dataUrl,function(finalUrl){
        (DB.itemMaster||[]).forEach(function(i){if(i.code===code)i.img=finalUrl;});
        mSave();
        toast(T("บันทึกรูปแล้ว","Saved")+" ("+kb+" KB)","ok");
        if(CUR)go(CUR);
      });
    });
  };
  inp.click();
}
function bindLongPressImgM(el,code){
  if(!el||el._lpBound)return;el._lpBound=true;
  var tmr=null;
  var start=function(){tmr=setTimeout(function(){editItemImageM(code);},500);};
  var cancel=function(){if(tmr){clearTimeout(tmr);tmr=null;}};
  el.addEventListener("touchstart",start,{passive:true});
  el.addEventListener("touchmove",cancel,{passive:true});
  el.addEventListener("touchend",cancel);
  el.addEventListener("mousedown",start);
  el.addEventListener("mouseup",cancel);
  el.addEventListener("mouseleave",cancel);
}
function bindAllItemImagesM(){
  document.querySelectorAll("[data-imgcode]").forEach(function(el){
    bindLongPressImgM(el,el.getAttribute("data-imgcode"));
  });
}
/* รายการฟังก์ชันที่ SuperAdmin ควบคุมได้ (ต้องตรงกับ LICENSABLE_FEATURES ในเว็บ) */
var LICENSABLE_M=["projects","boq","so-mgmt","po-mgmt","worker-mgmt","timesheet","gantt","stock-bal","inbound-reg","outbound-pick","stock-transfer","asset-mgmt","asset-move","asset-track","repair-mgmt","label-print","stock-report","wh-mgmt","supplier-master"];
/* ฟังก์ชันนี้เปิดใช้สำหรับบริษัทปัจจุบันไหม (ค่าเดียวกับเว็บ: co.features + co.licenseOn) */
function companyFeatureEnabledM(id){
  var r=session.user&&session.user.role;
  if(r==="SuperAdmin") return true;                 // SuperAdmin ไม่ถูกจำกัด
  if(LICENSABLE_M.indexOf(id)<0) return true;        // ฟังก์ชันนอกรายการ = ใช้ได้เสมอ
  var co=(META.companies||[]).find(function(c){return c.id===session.company;});
  if(!co||!co.licenseOn) return true;                // ไม่ได้เปิดการควบคุม = ใช้ได้ทุกฟังก์ชัน
  var exp=co.features&&co.features[id];

function __uiDialog(o){
  return new Promise(function(resolve){
    var isP=o.type==="prompt";
    var ov=document.createElement("div"); ov.className="ui-dlg-ov";
    var ic=o.danger?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
    ov.innerHTML='<div class="ui-dlg"><div class="ui-dlg-h"><div class="ui-dlg-ic"'+(o.danger?' style="background:rgba(220,38,38,.12);color:#dc2626"':'')+'>'+ic+'</div><span>'+esc(o.title||(isP?T("กรอกข้อมูล","Input"):T("ยืนยัน","Confirm")))+'</span></div>'
      +'<div class="ui-dlg-b">'+esc(String(o.msg==null?"":o.msg)).replace(/\n/g,"<br>")+(isP?'<input class="inp" id="__dlgInp" style="margin-top:12px" value="'+esc(o.def==null?"":String(o.def))+'">':'')+'</div>'
      +'<div class="ui-dlg-f">'+(o.noCancel?'':'<button class="btn ghost" data-a="0">'+T("ยกเลิก","Cancel")+'</button>')+'<button class="btn primary" data-a="1"'+(o.danger?' style="background:var(--danger,#dc2626)"':'')+'>'+T("ตกลง","OK")+'</button></div></div>';
    document.body.appendChild(ov);
    var inp=ov.querySelector("#__dlgInp"); if(inp){setTimeout(function(){inp.focus();inp.select();},30);}
    function done(v){ if(ov.parentNode)ov.parentNode.removeChild(ov); resolve(v); }
    ov.querySelectorAll("[data-a]").forEach(function(b){ b.onclick=function(){ var ok=b.getAttribute("data-a")==="1"; done(isP?(ok?(inp?inp.value:""):null):ok); }; });
    ov.addEventListener("mousedown",function(e){ if(e.target===ov) done(isP?null:false); });
    if(inp)inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); done(inp.value); } });
    document.addEventListener("keydown",function _k(e){ if(!ov.parentNode){document.removeEventListener("keydown",_k);return;} if(e.key==="Escape"){ document.removeEventListener("keydown",_k); done(isP?null:false); } });
  });
}

function sharePOImage(id){
  var po=DB.purchaseOrders.find(function(x){return x.id===id;});if(!po)return;
  var items=po.items||[]; var W=620, lineH=32, top=190, H=top+items.length*lineH+70;
  var c=document.createElement("canvas"); c.width=W; c.height=H; var ctx=c.getContext("2d");
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#e8720c"; ctx.fillRect(0,0,W,76);
  ctx.fillStyle="#ffffff"; ctx.font="bold 28px sans-serif"; ctx.fillText("ใบสั่งซื้อ "+po.id,26,48);
  ctx.fillStyle="#333333"; ctx.font="16px sans-serif";
  ctx.fillText("ผู้ขาย: "+(po.supplier||"-"),26,108);
  ctx.fillText("วันที่: "+(po.date||today()),26,134);
  ctx.fillStyle="#e8720c"; ctx.font="bold 15px sans-serif";
  ctx.fillText("รายการสินค้า",26,168); ctx.fillText("จำนวน",W-160,168);
  ctx.strokeStyle="#eeeeee"; ctx.lineWidth=1; ctx.beginPath();ctx.moveTo(26,178);ctx.lineTo(W-26,178);ctx.stroke();
  var y=top+18;
  items.forEach(function(it,i){ ctx.fillStyle="#222222"; ctx.font="15px sans-serif"; var nm=(i+1)+". "+(it.name||it.code); if(nm.length>44)nm=nm.slice(0,43)+"…"; ctx.fillText(nm,26,y); ctx.fillStyle="#e8720c"; ctx.font="bold 15px sans-serif"; ctx.fillText(num(it.qty)+" "+(it.unit||""),W-160,y); y+=lineH; });
  ctx.strokeStyle="#eeeeee"; ctx.beginPath();ctx.moveTo(26,y);ctx.lineTo(W-26,y);ctx.stroke();
  ctx.fillStyle="#333333"; ctx.font="bold 17px sans-serif"; ctx.fillText("รวม "+items.length+" รายการ",26,y+30);
  try{
    c.toBlob(function(blob){
      if(!blob){toast(T("สร้างรูปไม่สำเร็จ","Image failed"),"err");return;}
      var file=new File([blob],po.id+".png",{type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:"PO "+po.id,text:"ใบสั่งซื้อ "+po.id+" — "+(po.supplier||"")}).catch(function(){});
      } else {
        var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download=po.id+".png"; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ try{ window.open("https://line.me/R/msg/text/?"+encodeURIComponent("ใบสั่งซื้อ "+po.id+" ("+(po.supplier||"")+")"),"_blank"); }catch(e){} },400);
        toast(T("บันทึกรูปแล้ว — แนบส่งใน Line ได้เลย","Image saved — attach in Line"),"ok");
      }
    },"image/png");
  }catch(e){ toast(T("อุปกรณ์ไม่รองรับการแชร์รูป","Share not supported"),"err"); }
}
function openPOReceiveM(id){

  var locSel=locked
    ? '<input class="inp" value="'+esc(po.recvWarehouse)+'" readonly>'
    : '<select class="inp" id="poRecvLoc">'+DB.locationMaster.map(function(l){return '<option value="'+esc(l.code)+'">'+esc(l.code)+' ('+esc(l.warehouse)+')</option>';}).join("")+'</select>';

    else { right='<span style="font-weight:800;color:var(--orange);white-space:nowrap">'+T("ค้าง","pending")+' '+num(pending)+'</span>'; }

    +(canRecv?'<div class="field"><label>'+T("คลังรับเข้า","Receive Warehouse")+(locked?' ('+T("กำหนดจาก PO","from PO")+')':'')+'</label>'+locSel+'</div>':'')
    +(po.status==="Pending"?'<div class="alert warn" style="margin-bottom:8px">'+IC.info+' <span>'+T("PO นี้ยังไม่อนุมัติ — อนุมัติก่อนจึงรับเข้าได้","Approve this PO before receiving")+'</span></div>':'')
    +'<div class="card">'+(rows||'<div class="empty">'+T("ไม่มีรายการ","No items")+'</div>')+'</div>'

function poRecvLocM(po){
  var loc=(po.recvWarehouse&&DB.locationMaster.some(function(l){return l.code===po.recvWarehouse;}))?po.recvWarehouse:"";
  if(!loc) loc=(document.getElementById("poRecvLoc")||{}).value||"";

function receivePOLineM(id,idx){
  idx=parseInt(idx);
  var po=DB.purchaseOrders.find(function(x){return x.id===id;});if(!po)return;
  var it=po.items[idx];if(!it)return;
  var loc=poRecvLocM(po); if(!loc){toast(T("เลือกคลังรับเข้า","Select location"),"err");return;}
  var pending=(it.qty||0)-(it.received||0); if(pending<=0)return;
  var q=parseInt((document.getElementById("por_"+idx)||{}).value)||0;
  if(q<=0){toast(T("ใส่จำนวนรับเข้า","Enter qty"),"err");return;} if(q>pending)q=pending;
  adjustStockAt(it.code,loc,q); it.received=(it.received||0)+q;
  DB.history.push({id:++txnSeq,type:"IN",subtype:"RECEIVE",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:loc,poRef:po.id,note:"Mobile PO Receive (line)"});
  var allDone=(po.items||[]).every(function(x){return (x.received||0)>=(x.qty||0);});
  po.status=allDone?"Received":"Partial";
  mSave(); toast(T("รับเข้าแล้ว","Received")+" "+num(q)+" "+esc(it.name),"ok");
  if(allDone) openPendingPO(); else openPOReceiveM(id);
}
function receivePOM(id){
  var po=DB.purchaseOrders.find(function(x){return x.id===id;});if(!po)return;
  var loc=po.recvWarehouse||(document.getElementById("poRecvLoc")||{}).value||"";
  if(!(po.recvWarehouse&&DB.locationMaster.some(function(l){return l.code===po.recvWarehouse;}))) loc=(document.getElementById("poRecvLoc")||{}).value||loc;
  if(!loc){toast(T("เลือกคลังรับเข้า","Select location"),"err");return;}
  var any=false;
  (po.items||[]).forEach(function(it,idx){
    var pending=(it.qty||0)-(it.received||0); if(pending<=0)return;
    var q=parseInt((document.getElementById("por_"+idx)||{}).value)||0; if(q<=0)return; if(q>pending)q=pending;
    adjustStockAt(it.code,loc,q); it.received=(it.received||0)+q;
    DB.history.push({id:++txnSeq,type:"IN",subtype:"RECEIVE",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:loc,poRef:po.id,note:"Mobile PO Receive"});
    any=true;
  });
  if(!any){toast(T("ใส่จำนวนรับเข้า","Enter qty"),"err");return;}
  var allDone=(po.items||[]).every(function(it){return (it.received||0)>=(it.qty||0);});
  po.status=allDone?"Received":"Partial";
  mSave(); toast(T("รับเข้าแล้ว","Received")+" → "+loc,"ok");
  if(allDone) openPendingPO(); else openPOReceiveM(id);
}

function reportAddImg(e){
  var files=e.target.files; if(!files||!files.length)return;
  window._rptImgs=window._rptImgs||[];
  Array.from(files).forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var max=1000,w=img.width,h=img.height;
        if(w>max||h>max){var s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
        var c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{window._rptImgs.push(c.toDataURL("image/jpeg",0.7));}catch(err){}
        renderRptPrev();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value="";
}

    if(canR&&recvPending>0){ act+='<div style="text-align:right"><input class="inp" id="rqr_'+idx+'" type="number" min="0" max="'+recvPending+'" value="'+recvPending+'" style="width:58px;padding:6px;text-align:center"><br><button class="btn ok sm" style="margin-top:4px;padding:6px 12px;font-size:12px" data-r="'+esc(reqId)+'" data-i="'+idx+'" onclick="reqReceiveM(this.dataset.r,this.dataset.i)">'+T("รับเข้า","Receive")+'</button></div>'; }

    return '<div class="row"><div class="rt"><b>'+esc(it.name)+'</b><small>'+esc(it.code)+' · '+info+'</small><div style="margin-top:3px">'+stat+'</div></div>'+act+'</div>';

    +'<div class="sub" style="margin-bottom:8px">'+T("โอนย้าย 2 ขั้น: ต้นทาง “เบิก” (ตัด HEAD) → ปลายทาง “รับเข้า” (เข้าคลังโปรเจค)","2-step: Dispatch (HEAD) → Receive (project)")+'</div>'
    +'<div class="card">'+(rows||'<div class="empty">'+T("ไม่มีรายการ","No items")+'</div>')+'</div>'

  openSheet(body);

function canReqDispatchM(){ return headWHLocsM().some(function(l){return inScopeLoc(l);}); }
function canReqReceiveM(projLoc){ return inScopeLoc(projLoc); }
function reqStatusM(r){
  var items=r.items||[];
  var allRecv=items.every(function(x){return (x.qtyReceived||0)>=(x.qtyPlan||0);});
  var allDisp=items.every(function(x){return (x.qtyIssued||0)>=(x.qtyPlan||0);});
  var anyDisp=items.some(function(x){return (x.qtyIssued||0)>0;});
  r.status=allRecv?"Completed":(allDisp?"Issued":(anyDisp?"Partial":(r.status||"Open")));
}
function reqDispatchM(reqId,idx){
  idx=parseInt(idx);
  var r=(DB.requisitions||[]).find(function(x){return x.id===reqId;});if(!r)return;
  var it=r.items[idx];if(!it)return;
  var projLoc=reqProjLocM(r.projectId); if(!projLoc){toast(T("โปรเจคไม่มีคลัง","No project WH"),"err");return;}
  var remain=(it.qtyPlan||0)-(it.qtyIssued||0);
  var q=parseInt((document.getElementById("rqd_"+idx)||{}).value)||0;
  if(q<=0){toast(T("ใส่จำนวน","Enter qty"),"err");return;}
  if(q>remain)q=remain;
  var avail=headStockM(it.code); if(q>avail){toast(T("คลัง Head ไม่พอ","HEAD short")+" ("+avail+")","err");return;}
  var left=q,hl=headWHLocsM();
  for(var hi=0;hi<hl.length&&left>0;hi++){var a=getStockQty(it.code,hl[hi]);if(a<=0)continue;var take=Math.min(a,left);adjustStockAt(it.code,hl[hi],-take);left-=take;}
  it.qtyIssued=(it.qtyIssued||0)+q;
  var by=(session.user&&(session.user.fullName||session.user.username))||"";
  DB.history.push({id:++txnSeq,type:"OUT",subtype:"TRANSFER",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:"HEAD-WH",toLoc:projLoc,project:r.projectId,by:by,note:"เบิกโอน (ใบเบิก "+reqId+") รอปลายทางรับ"});
  reqStatusM(r); mSave(); toast(T("เบิกแล้ว — รอปลายทางรับ","Dispatched"),"ok"); openReqDetailM(reqId);
}
function reqReceiveM(reqId,idx){
  idx=parseInt(idx);
  var r=(DB.requisitions||[]).find(function(x){return x.id===reqId;});if(!r)return;
  var it=r.items[idx];if(!it)return;
  var projLoc=reqProjLocM(r.projectId); if(!projLoc){toast(T("โปรเจคไม่มีคลัง","No project WH"),"err");return;}
  var pending=(it.qtyIssued||0)-(it.qtyReceived||0);
  var q=parseInt((document.getElementById("rqr_"+idx)||{}).value)||0;
  if(q<=0){toast(T("ใส่จำนวน","Enter qty"),"err");return;}
  if(q>pending)q=pending;
  adjustStockAt(it.code,projLoc,q);
  it.qtyReceived=(it.qtyReceived||0)+q;
  var by=(session.user&&(session.user.fullName||session.user.username))||"";
  DB.history.push({id:++txnSeq,type:"IN",subtype:"RECEIVE",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:projLoc,fromLoc:"HEAD-WH",project:r.projectId,by:by,note:"รับโอน (ใบเบิก "+reqId+")"});
  reqStatusM(r); mSave(); toast(T("รับเข้าแล้ว","Received")+" "+q+" → "+projLoc,"ok"); openReqDetailM(reqId);
}

      .filter(function(i){ if(whLocs)return qtyOf(i.code)>0; return userScopeWH()?scopeStock(i.code)>0:true; })

function _cntLocs(){ if(userScopeWH())return scopeLocs().map(function(l){return l.code;});
  if(window._cntWH&&window._cntWH!=="ALL")return DB.locationMaster.filter(function(l){return l.warehouse===window._cntWH;}).map(function(l){return l.code;}); return null; }
function _cntQtyOf(code){ var wl=_cntLocs(); if(wl)return locBalances(code).filter(function(x){return wl.indexOf(x.loc)>=0;}).reduce(function(s,x){return s+x.qty;},0); return totalStock(code); }
function renderCount(){
  if(!window._cntWH)window._cntWH="ALL";
  var scope=userScopeWH();
  var whs=[...new Set(DB.locationMaster.map(function(l){return l.warehouse;}).filter(Boolean))].sort();
  var wl=_cntLocs();
  function todayCount(code){ var cs=(DB.history||[]).filter(function(h){return h.subtype==="COUNT"&&h.code===code&&h.date===today()&&(!wl||wl.indexOf(h.loc)>=0);}); return cs.length?cs[cs.length-1]:null; }
  var whSel=scope?'':('<div class="field" style="margin-bottom:10px"><label>'+T("คลัง (Warehouse)","Warehouse")+'</label><select class="inp" onchange="window._cntWH=this.value;renderCount()"><option value="ALL" '+(window._cntWH==="ALL"?"selected":"")+'>'+T("ทุกคลัง","All WH")+'</option>'+whs.map(function(w){return '<option value="'+esc(w)+'" '+(window._cntWH===w?"selected":"")+'>'+esc(w)+'</option>';}).join("")+'</select></div>');
  var rows=DB.itemMaster.filter(function(i){return !i._isStockPos&&itemInScopeM(i.code);})
    .sort(function(a,b){return String(a.code||"").localeCompare(String(b.code||""),undefined,{numeric:true,sensitivity:"base"});})
    .map(function(i){ var q=_cntQtyOf(i.code); var tc=todayCount(i.code); var badge='';
      if(tc){ var d=parseInt(tc.diff)||0; badge=' <span style="font-size:11px;font-weight:800;padding:2px 7px;border-radius:20px;background:'+(d>=0?"#dcfce7;color:#16a34a":"#fee2e2;color:#dc2626")+'">'+(d>=0?"+":"")+num(d)+'</span>'; }
      return '<div class="row" data-s="'+esc((i.code+" "+i.name).toLowerCase())+'" onclick="openCountM(\''+esc(i.code)+'\')"><div class="thumb" data-imgcode="'+esc(i.code)+'">'+(i.img?'<img src="'+esc(imgSrc(i.img))+'">':(i.type==="ASSET"?IC.asset:IC.box))+'</div><div class="rt"><b>'+esc(i.name)+'</b><small>'+esc(i.code)+(tc?' · '+T("นับแล้ววันนี้","Counted today"):'')+'</small></div><div class="rv">'+num(q)+badge+' <small style="color:var(--sub);font-weight:500">'+esc(i.unit||"")+'</small></div></div>';
    }).join("")||'<div class="empty">'+T("ไม่มีสินค้า","No items")+'</div>';

    +'<div class="search" style="margin-bottom:10px">'+IC.search+'<input class="inp" placeholder="'+T("ค้นหารหัส/ชื่อ","Search code/name")+'" oninput="filterList(this.value,\'cntList\')"></div>'
    +whSel+'<div class="card" id="cntList">'+rows+'</div>';
  document.getElementById("app").innerHTML=shell(inner);

function openCountM(code){
  var it=itemByCode(code)||{code:code}; window._cntPhoto="";
  var cur=_cntQtyOf(code);
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb">'+(it.img?'<img src="'+esc(imgSrc(it.img))+'">':(it.type==="ASSET"?IC.asset:IC.box))+'</div><div><b>'+esc(it.name||code)+'</b><small>'+esc(code)+' · '+T("คงเหลือระบบ","System")+' '+num(cur)+' '+esc(it.unit||"")+'</small></div></div>'

    +'<div class="field"><label>'+T("จำนวนที่นับได้","Counted quantity")+'</label><input class="inp" id="cntQty" type="number" inputmode="numeric" value="'+cur+'" style="font-size:20px;font-weight:800;text-align:center"></div>'
    +'<div class="field"><label>'+T("แนบรูป (ถ้ามี)","Photo (optional)")+'</label><input type="file" accept="image/*" capture="environment" onchange="cntPickPhoto(this)"><div id="cntPhotoPrev" style="margin-top:8px"></div></div>'
    +'<div class="sub" style="margin:2px 0 10px">'+T("* ระบบจะปรับยอดคงเหลือให้เท่ากับจำนวนที่นับ","* Stock will be set to the counted quantity")+'</div>'

function saveCountM(code,cur){
  var el=document.getElementById("cntQty"); var counted=parseInt(el&&el.value);
  if(isNaN(counted)||counted<0){toast(T("กรุณาใส่จำนวนที่นับได้","Enter counted quantity"),"err");return;}
  var it=itemByCode(code)||{code:code};
  var locs=_cntLocs()||DB.locationMaster.map(function(l){return l.code;});
  var ws=(DB.stockLedger||[]).filter(function(x){return x.code===code&&locs.indexOf(x.loc)>=0&&(parseInt(x.qty)||0)>0;});
  var targetLoc=ws.length?ws[0].loc:(locs[0]||it.loc||"HEAD-WH");
  var prev=parseInt(cur)||0; var diff=counted-prev;
  if(diff!==0)adjustStockAt(code,targetLoc,diff);
  var by=(session.user&&(session.user.fullName||session.user.username))||"";
  DB.history.push({id:++txnSeq,type:diff>=0?"IN":"OUT",subtype:"COUNT",date:today(),time:nowTime(),code:code,name:it.name||code,qty:Math.abs(diff),unit:it.unit||"",loc:targetLoc,by:by,note:T("นับสต๊อก","Stock count"),countedQty:counted,prevQty:prev,diff:diff,photo:window._cntPhoto||""});
  window._cntPhoto=""; mSave(); closeSheet(); toast(T("บันทึกการนับแล้ว","Count saved"),"ok"); renderCount();
}

      return '<div class="row" onclick="histDetailM('+hi+')" style="cursor:pointer"><div class="rt"><b>'+esc(h.name||h.code)+'</b><small>'+fmtDate(h.date)+' · '+esc(sub)+' · '+esc(h.loc||"")+(h.toLoc?' → '+esc(h.toLoc):'')+'</small></div><div style="text-align:right">'+io+'<div style="font-weight:800;margin-top:3px">'+num(h.qty)+' <small style="color:var(--sub);font-weight:500">'+esc(h.unit||"")+'</small></div></div>'
        +(isAdminM()?'<div style="margin-left:8px;display:flex;align-items:center" onclick="event.stopPropagation()"><button class="hbtn" onclick="histActionsM('+hi+')" title="'+T("จัดการ","Actions")+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button></div>':'')

function itemSaveM(origCode){
  var code=(document.getElementById("im_code").value||"").trim();
  var name=(document.getElementById("im_name").value||"").trim();
  if(!code||!name){toast(T("กรอกรหัสและชื่อสินค้า","Code and name required"),"err");return;}
  var isNew=!origCode;
  if(isNew&&DB.itemMaster.some(function(i){return i.code===code&&!i._isStockPos;})){toast(T("รหัสสินค้านี้มีอยู่แล้ว","Code already exists"),"err");return;}
  var data={
    name:name,
    type:document.getElementById("im_type").value,
    unit:(document.getElementById("im_unit").value||"").trim(),
    cat:(document.getElementById("im_cat").value||"").trim(),
    minQty:parseInt(document.getElementById("im_min").value)||0,
    barcode:(document.getElementById("im_barcode").value||"").trim()
  };
  if(isNew){
    DB.itemMaster.push(Object.assign({code:code,_isStockPos:false,img:""},data));
  } else {
    DB.itemMaster.forEach(function(i){ if(i.code===origCode){ Object.assign(i,data); } });
  }
  mSave();
  toast(isNew?T("เพิ่มสินค้าแล้ว","Item added"):T("บันทึกแล้ว","Saved"),"ok");
  openItemMasterM();
}
async function itemDeleteM(code){
  var used=(DB.stockLedger||[]).some(function(sl){return sl.code===code&&(sl.qty||0)>0;});
  if(used){toast(T("ลบไม่ได้ — สินค้านี้ยังมีสต๊อกคงเหลือ","Cannot delete — item has stock"),"err");return;}
  if(!await __confirm(T("ยืนยันลบสินค้านี้?","Delete this item?")))return;
  DB.itemMaster=DB.itemMaster.filter(function(i){return !(i.code===code);});
  // ลบรูปบน server (ถ้ามี)
  try{fetch(apiUrl("delimg")+"&cid="+encodeURIComponent(session.company||"global")+"&code="+encodeURIComponent(code),{cache:"no-store"});}catch(e){}
  mSave();
  toast(T("ลบสินค้าแล้ว","Item deleted"),"ok");
  openItemMasterM();
}

  var r=(DB.repairs||[]).find(function(x){return x.id===id;}); if(!r||r.status!=="InRepair")return;
  if(!await __confirm(T("ยืนยันรับคืนจากซ่อม? สต๊อกจะถูกคืนเข้าคลัง","Confirm return? Stock will be added back")))return;

  var _nm=r.name||(itemByCode(_c)||{}).name||_c;

  adjustStockAt(_c,r.loc||"HEAD-WH",r.qty||1);
  r.status="Returned"; r.returnDate=today(); r.returnBy=(session.user&&session.user.username)||"";
  // บันทึกประวัติ

function soUpdateStatusM(so){
  var its=so.items||[];if(!its.length)return;
  var anyDisp=its.some(function(i){return (i.qtyDispatched||0)>0;});
  var allCR=its.every(function(i){return (i.qtyClientRecv||0)>=(i.qtyDispatched||0);});
  var anyRet=its.some(function(i){return (i.qtyClientReturn||0)>0;});
  var allRetB=its.every(function(i){return (i.qtyRecvBack||0)>=(i.qtyClientReturn||0)&&(i.qtyClientReturn||0)>0;});
  if(allRetB&&anyRet)so.status="ReceivedBack";
  else if(anyRet)so.status="ClientReturned";
  else if(allCR&&anyDisp)so.status="ClientReceived";
  else if(anyDisp)so.status="Dispatched";
  else so.status="Draft";
}

/* SO detail + process */
var SO_TRANS=[
  {key:"dispatch",    step:"Draft",          label:function(){return T("ส่งสินค้า","Dispatch");},          remain:function(it){return (it.qty||0)-(it.qtyDispatched||0);}},
  {key:"clientrecv",  step:"Dispatched",     label:function(){return T("ยืนยันลูกค้ารับ","Client Receive");},remain:function(it){return (it.qtyDispatched||0)-(it.qtyClientRecv||0);}},
  {key:"clientreturn",step:"ClientReceived", label:function(){return T("ลูกค้าส่งคืน","Client Return");},   remain:function(it){return (it.qtyClientRecv||0)-(it.qtyClientReturn||0);}},
  {key:"recvback",    step:"ClientReturned", label:function(){return T("รับคืนเข้าคลัง","Receive Back");},  remain:function(it){return (it.qtyClientReturn||0)-(it.qtyRecvBack||0);}}
];
function soWorkerChips(so){
  var ws=(so.workers||[]);if(!ws.length)return '';
  return '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">'+ws.map(function(w){var nm=w.name||w;return '<span class="pill info" style="background:#e0f2fe"><i></i>👷 '+esc(nm)+(w.role?' ('+esc(w.role)+')':'')+'</span>';}).join("")+'</div>';
}
function openSODetailM(id){
  var so=(DB.salesOrders||[]).find(function(s){return s.id===id;});if(!so)return;
  var ci=Math.max(0,SO_STEPS.indexOf(so.status));
  var stepper=SO_STEPS.map(function(st,i){
    var done=i<=ci,next=(i===ci+1);
    var col=done?"#22c55e":next?"#e8720c":"#d8d4cb";
    return '<div style="flex:1;text-align:center"><div style="width:26px;height:26px;border-radius:50%;margin:0 auto;background:'+(done?"#22c55e":next?"#fff":"#f0f0eb")+';border:2px solid '+col+';color:'+(done?"#fff":col)+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800">'+(done?"✓":(i+1))+'</div>'
      +'<div style="font-size:9px;margin-top:3px;color:'+(done?"#16a34a":next?"#e8720c":"var(--sub2)")+';font-weight:700">'+soStatLabelM(st).split(" ")[0]+'</div></div>';
  }).join('<div style="flex:0 0 8px;height:2px;background:#e2e2dc;margin-top:13px"></div>');
  var itemRows=(so.items||[]).map(function(it){
    var out=Math.max(0,(it.qtyDispatched||0)-(it.qtyRecvBack||0));
    return '<div class="row"><div class="rt"><b>'+esc(it.name)+'</b><small>'+esc(it.code)+' · '+T("สั่ง","ordered")+' '+num(it.qty)+' '+esc(it.unit||"")+'</small>'
      +'<div style="font-size:11px;color:var(--sub2);margin-top:2px">'+T("ส่ง","D")+' '+num(it.qtyDispatched||0)+' · '+T("รับ","R")+' '+num(it.qtyClientRecv||0)+' · '+T("คืน","Rt")+' '+num(it.qtyClientReturn||0)+' · '+T("คืนคลัง","B")+' '+num(it.qtyRecvBack||0)+'</div></div>'
      +'<div class="rv">'+(out>0?'<span style="color:var(--orange)">'+T("ค้าง ","out ")+num(out)+'</span>':'<span class="pill ok"><i></i>'+T("ครบ","done")+'</span>')+'</div></div>';
  }).join("");
  // ปุ่มแต่ละ transition ที่ยังมีของค้าง (รวมย้อนขั้นก่อนหน้า)
  var actBtns=SO_TRANS.map(function(tr){
    var totRemain=(so.items||[]).reduce(function(s,it){return s+Math.max(0,tr.remain(it));},0);
    if(totRemain<=0) return '';
    var isNext=(tr.step===so.status);
    return '<button class="btn '+(isNext?"primary":"ghost")+'" style="margin-bottom:8px" onclick="soStepForm(\''+esc(id)+'\',\''+tr.key+'\')">'+(isNext?"▶ ":"↩ ")+tr.label()+' <span style="opacity:.8;font-weight:600">('+T("ค้าง ","")+totRemain+')</span></button>';
  }).join("");
  var allDone=(so.items||[]).every(function(it){return (it.qtyRecvBack||0)>=(it.qty||0);});
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:var(--orange-grad)">'+IC.trf.replace(/currentColor/g,"#fff")+'</div><div><b>'+esc(so.id)+'</b><small>'+esc(so.customer||"-")+' · '+fmtDate(so.date)+' · <span class="pill '+soStatClassM(so.status)+'" style="padding:1px 8px">'+soStatLabelM(so.status)+'</span></small></div></div>'
    +soWorkerChips(so)
    +'<div style="display:flex;align-items:flex-start;margin:6px 0 16px">'+stepper+'</div>'
    +'<div class="card" style="margin-bottom:14px">'+itemRows+'</div>'
    +(actBtns||(allDone?'<div class="pill ok" style="width:100%;justify-content:center;padding:14px;font-size:14px"><i></i>'+T("เสร็จสมบูรณ์","Completed")+'</div>':''))
    +'<button class="btn ghost" style="margin-top:4px" onclick="closeSheet()">'+T("ปิด","Close")+'</button>';
  openSheet(body);
}
/* ฟอร์มระบุจำนวนของแต่ละ transition */
function soStepForm(id,key){
  var so=(DB.salesOrders||[]).find(function(s){return s.id===id;});if(!so)return;
  var tr=SO_TRANS.find(function(t){return t.key===key;});if(!tr)return;
  var head=homeLoc();
  var rows=(so.items||[]).map(function(it,idx){
    var rem=Math.max(0,tr.remain(it));if(rem<=0)return '';
    var cap=rem;
    if(key==="dispatch"){var av=getStockQty(it.code,head);cap=Math.min(rem,av);}
    return '<div class="row"><div class="rt"><b>'+esc(it.name)+'</b><small>'+esc(it.code)+' · '+T("ค้าง","remain")+' '+num(rem)+(key==="dispatch"?' · '+T("คลังมี","stock")+' '+num(getStockQty(it.code,head)):'')+'</small></div>'
      +'<input class="inp" type="number" min="0" max="'+cap+'" value="'+cap+'" data-idx="'+idx+'" style="width:76px;padding:8px" id="sf_'+idx+'"></div>';
  }).join("");
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:var(--orange-grad)">'+IC.trf.replace(/currentColor/g,"#fff")+'</div><div><b>'+tr.label()+'</b><small>'+esc(so.id)+' · '+esc(so.customer||"")+'</small></div></div>'
    +'<div class="sub" style="margin-bottom:8px">'+T("ระบุจำนวนที่จะดำเนินการในแต่ละรายการ","Set quantity for each item")+'</div>'
    +'<div class="card" style="margin-bottom:14px">'+(rows||'<div class="empty">'+T("ไม่มีของค้าง","Nothing pending")+'</div>')+'</div>'
    +'<button class="btn primary" onclick="soDoStep(\''+esc(id)+'\',\''+key+'\')">'+T("ยืนยัน","Confirm")+' '+tr.label()+'</button>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="openSODetailM(\''+esc(id)+'\')">'+T("ยกเลิก","Back")+'</button>';
  openSheet(body);
}
function soDoStep(id,key){
  var so=(DB.salesOrders||[]).find(function(s){return s.id===id;});if(!so)return;
  var tr=SO_TRANS.find(function(t){return t.key===key;});if(!tr)return;
  var loc=soLocNameM(id), head=homeLoc(); soEnsureLocM(id);
  var any=false, errStock=false;
  (so.items||[]).forEach(function(it,idx){
    var inp=document.getElementById("sf_"+idx); if(!inp)return;
    var q=parseInt(inp.value)||0; var rem=Math.max(0,tr.remain(it)); if(q<=0)return; if(q>rem)q=rem;
    if(key==="dispatch"){
      var av=getStockQty(it.code,head); if(av<q){q=av;} if(q<=0){errStock=true;return;}
      it.qtyDispatched=(it.qtyDispatched||0)+q; adjustStockAt(it.code,head,-q); adjustStockAt(it.code,loc,q);
      DB.history.push({id:++txnSeq,type:"OUT",subtype:"SO_DISPATCH",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:head,toLoc:loc,soRef:id,customer:so.customer,note:"Mobile SO Dispatch"}); any=true;
    } else if(key==="clientrecv"){
      it.qtyClientRecv=(it.qtyClientRecv||0)+q;
      DB.history.push({id:++txnSeq,type:"IN",subtype:"SO_CLIENT_RECV",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:loc,soRef:id,customer:so.customer,note:"Mobile Client Recv"}); any=true;
    } else if(key==="clientreturn"){
      it.qtyClientReturn=(it.qtyClientReturn||0)+q;
      DB.history.push({id:++txnSeq,type:"OUT",subtype:"SO_CLIENT_RETURN",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:loc,soRef:id,customer:so.customer,note:"Mobile Client Return"}); any=true;
    } else if(key==="recvback"){
      it.qtyRecvBack=(it.qtyRecvBack||0)+q; adjustStockAt(it.code,loc,-q); adjustStockAt(it.code,head,q);
      DB.history.push({id:++txnSeq,type:"IN",subtype:"SO_RECV_BACK",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:head,fromLoc:loc,soRef:id,customer:so.customer,note:"Mobile Recv Back"}); any=true;
    }
  });
  if(!any){toast(errStock?T("สต๊อกคลังไม่พอ","Insufficient stock"):T("ไม่มีจำนวนที่จะดำเนินการ","Nothing to process"),"err");return;}
  soUpdateStatusM(so); mSave();
  toast(T("อัพเดทแล้ว: ","Updated: ")+tr.label(),"ok");
  openSODetailM(id);
}

  openSheet(body);
  bindPickScan();

function bindPickScan(){
  var b=document.getElementById("pickScan"); if(!b)return;
  b.ontouchstart=function(e){e.preventDefault();b.classList.add("holding");startScan();};
  b.ontouchend=function(e){e.preventDefault();b.classList.remove("holding");stopScan();};
  b.ontouchcancel=function(){b.classList.remove("holding");stopScan();};
  b.onmousedown=function(){b.classList.add("holding");startScan();};
  b.onmouseup=function(){b.classList.remove("holding");stopScan();};
  b.onmouseleave=function(){if(scanning){b.classList.remove("holding");stopScan();}};
}

function openItemAction(code){

  } else {

    acts='<div class="alert info" style="margin:0"><span>'+IC.info+' '+T("สินค้านี้ไม่ได้อยู่ในคลังของคุณ — ดูได้อย่างเดียว ไม่สามารถรับ/เบิก/โอนได้","This item is not in your warehouse — view only")+'</span></div>';
  }
  // Admin: ปุ่มแก้ไขรูปภาพสินค้า (บีบอัด <100KB เก็บใน images/{cid}/)
  if(isAdminM()){
    if(!it.img){ acts+='<div class="opt" style="border-color:#c7d2fe" onclick="editItemImageM(\''+esc(code)+'\')"><div class="oi" style="background:#eef2ff;color:#4f46e5">'+IC.camera+'</div><div><b>'+T("เพิ่มรูปภาพ","Add Image")+'</b><small>'+T("บีบอัดอัตโนมัติ ≤100KB","Auto-compress ≤100KB")+'</small></div></div>'; }
  }

    +(lb.length?'<div class="card" style="margin-bottom:16px">'+lb.map(function(x){return '<div class="row"><div class="rt"><b>'+esc(x.loc)+'</b></div><div class="rv">'+num(x.qty)+'</div></div>';}).join("")+'</div>':'')

function assetPickPhoto(){
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.capture="environment";inp.style.display="none";
  document.body.appendChild(inp);

  // อัปเดตหน้าที่อยู่เบื้องหลัง (เช่น Stock) ให้ตัวเลขเปลี่ยนทันที
  if(typeof CUR!=="undefined"&&CUR){ try{go(CUR);}catch(e){} }

function holdScan(e){ if(e&&e.preventDefault)e.preventDefault(); startScan(); }
function releaseScan(){ stopScan(); }
function startScan(){
  if(scanning)return; scanning=true;
  try{ if(!_audioCtx)_audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(_audioCtx.state==="suspended")_audioCtx.resume(); }catch(e){}
  var hint=document.getElementById("scanHint");
  if(hint) hint.innerHTML=(_scanMode==="location"?(T("เล็งกล้องไปที่ QR คลัง","Aim at location QR")+"<small>"+T("ปล่อยเพื่อปิดกล้อง","Release to close")+"</small>"):(T("เล็งกล้องไปที่ QR / Barcode","Aim at QR / Barcode")+"<small>"+T("ปล่อยนิ้วเพื่อปิดกล้อง","Release to close")+"</small>"));
  document.getElementById("scanOv").classList.add("show");
  if(typeof Html5Qrcode==="undefined"){toast(T("โหลดตัวสแกนไม่ได้ (ต้องต่อเน็ต)","Scanner not loaded"),"err");stopScan();return;}
  try{
    qrScanner=new Html5Qrcode("reader",{verbose:false});
    qrScanner.start({facingMode:"environment"},{fps:12},onScan,function(){})
      .catch(function(err){toast(T("เปิดกล้องไม่ได้","Camera error")+": "+err,"err");stopScan();});
  }catch(e){toast(T("เปิดกล้องไม่ได้","Camera error"),"err");stopScan();}
}
function stopScan(){
  document.getElementById("scanOv").classList.remove("show");
  if(qrScanner){var s=qrScanner;qrScanner=null;try{s.stop().then(function(){try{s.clear();}catch(e){}}).catch(function(){});}catch(e){}}
  scanning=false;
}
var _lastScan=0, _audioCtx=null, _scanMode="item", _scanTarget="";
function scanLoc(targetId){ _scanMode="location"; _scanTarget=targetId; startScan(); }
function scanLocStart(e,targetId){ if(e){try{e.preventDefault();}catch(_){}} _scanMode="location"; _scanTarget=targetId; startScan(); }
function scanLocEnd(e){ if(e){try{e.preventDefault();}catch(_){}} if(scanning){ _scanMode="item"; _scanTarget=""; stopScan(); } }
function resolveLoc(text){
  var t=String(text||"").trim(); if(!t)return null;
  var loc=DB.locationMaster.find(function(l){return String(l.code).toLowerCase()===t.toLowerCase();});
  if(!loc) loc=DB.locationMaster.find(function(l){return String(l.code).length>=3 && t.toLowerCase().indexOf(String(l.code).toLowerCase())>=0;});
  return loc?loc.code:null;
}
function beep(type){
  try{
    if(!_audioCtx)_audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var ctx=_audioCtx; if(ctx.state==="suspended")ctx.resume();
    function tone(freq,start,dur,vol){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+start);
      g.gain.exponentialRampToValueAtTime(vol||0.3,ctx.currentTime+start+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+start+dur);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+0.03);
    }
    if(type==="ok"){ tone(880,0,0.09); tone(1320,0.10,0.13); }               // ผ่าน: สองโน้ตขึ้น
    else if(type==="nostock"){ tone(700,0,0.12); tone(700,0.16,0.12); }      // ไม่มีของ: บี๊บซ้ำเสียงกลาง
    else { tone(300,0,0.30,0.35); }                                          // ไม่ผ่าน: เสียงต่ำยาว
  }catch(e){}
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function onScan(text){
  var now=Date.now(); if(now-_lastScan<1200)return; _lastScan=now;
  stopScan();
  // โหมดสแกนคลัง (From/To location)
  if(_scanMode==="location"){
    var tgt=_scanTarget; _scanMode="item"; _scanTarget="";
    var code=resolveLoc(text); var sel=document.getElementById(tgt);
    if(code&&sel){
      var has=false; for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===code){has=true;break;} }
      if(has){ sel.value=code; beep("ok"); vib(70); toast(T("เลือกคลัง: ","Location: ")+code,"ok"); try{if(sel.onchange)sel.onchange();}catch(e){} }
      else { beep("fail"); vib([90,50,90]); toast(T("คลังนี้เลือกไม่ได้: ","Not selectable: ")+code,"err"); }
    } else { beep("fail"); vib([90,50,90]); toast(T("ไม่พบคลัง: ","Location not found: ")+text,"err"); }
    return;
  }
  var it=findScanned(text);
  if(!it){ beep("fail"); vib([90,50,90]); toast(T("ไม่พบสินค้า: ","Not found: ")+text,"err"); openManualPick(_opAction||"receive"); return; }
  // Receive/Issue ไม่รองรับ Asset
  if((_opAction==="receive"||_opAction==="issue")&&it.type==="ASSET"){ beep("fail"); vib([90,50,90]); toast(T("Asset ใช้ได้เฉพาะการโอนย้าย","Assets support transfer only"),"err"); return; }
  // ตรวจ "ไม่มีของ" สำหรับเบิก/ย้าย
  if(_opAction==="issue"||_opAction==="transfer"){
    var avail=userScopeWH()?scopeStock(it.code):totalStock(it.code);
    if(avail<=0){ beep("nostock"); vib([70,60,70]); toast(T("ไม่มีของในสต๊อก: ","No stock: ")+esc(it.name),"err"); }
    else { beep("ok"); vib(70); }
  } else { beep("ok"); vib(70); }
  if(_opAction){ opForm(_opAction,it.code); }
  else { openItemAction(it.code); }
}

  var err=_connErr?('<div style="color:var(--danger);font-size:12px;margin-top:8px;line-height:1.5">⚠ '+esc(_connErr)+'</div>'):'';
  document.getElementById("app").innerHTML='<div class="auth"><div class="brand"><div class="lg">'+IC.logo+'</div><h1>CONST-WMS</h1></div>'
    +'<div class="empty">'+T("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ หรือไม่พบข้อมูล","Cannot reach server / no data")+'</div>'
    +err
    +'<button class="btn primary" style="margin-top:12px" onclick="testConn()">'+T("ทดสอบการเชื่อมต่อ","Test connection")+'</button>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="setApiConfig()">'+T("ตั้งค่าเซิร์ฟเวอร์","Server settings")+'</button>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="boot()">'+T("ลองใหม่","Retry")+'</button>'
    +'<p style="text-align:center;font-size:11px;color:var(--sub);margin-top:16px">'+esc(mode)+'<br>'+esc(PHP_API)+'</p></div>';
}
async function setApiConfig(){
  var url=await __prompt(T("Web App URL (Google Apps Script /exec หรือ api.php)","Web App URL (Apps Script /exec or api.php)"),PHP_API); if(url===null)return;
  var tk=await __prompt(T("Secret Key / Token (ต้องตรงกับ Code.gs)","Secret Key / Token"),PHP_TOKEN); if(tk===null)return;
  PHP_API=url.trim()||PHP_API; PHP_TOKEN=tk.trim();
  try{
    if(PHP_API.indexOf("script.google.com")>=0){ localStorage.setItem("_wms_gs_url",PHP_API); localStorage.setItem("_wms_gs_key",PHP_TOKEN); }
    else { localStorage.setItem("_wms_api_url",PHP_API); localStorage.setItem("_wms_api_token",PHP_TOKEN); }
  }catch(e){}
  boot();
}
function proceedAfterData(){
  txnSeq=META.txnSeq||0;
  var sess=null; try{sess=JSON.parse(localStorage.getItem(SESS_KEY)||"null");}catch(e){}
  if(sess&&sess.user){
    var u=(META.users||[]).find(function(x){return x.username===sess.user.username;})||sess.user;
    session.user=u; activateCompany(sess.company||u.company||(META.companies[0]&&META.companies[0].id));
    if(u.pin){ screenPin(u); } else { go("home"); }
  } else { screenLogin(); }
}
function boot(){
  // รับค่าเชื่อมต่อ Google Sheets จาก URL (?gs=...&gk=...) — มาจากลิงก์/QR ของเว็บหลัก
  try{
    var qs=new URLSearchParams(location.search);
    var gs=qs.get("gs"), gk=qs.get("gk");
    if(gs){ PHP_API=gs; if(gk)PHP_TOKEN=gk;
      localStorage.setItem("_wms_gs_url",PHP_API); if(gk)localStorage.setItem("_wms_gs_key",PHP_TOKEN); }
  }catch(e){}
  showLoading();
  loadFromServer().then(function(remote){
    if(remote&&remote.companies&&remote.companies.length){
      META=remote; try{localStorage.setItem(DB_KEY,JSON.stringify(META));}catch(e){}
      proceedAfterData();
    } else if(loadMETA()){
      proceedAfterData();  // offline fallback / backend ยังว่าง: ใช้ข้อมูลใน cache
      if(_connErr){ setTimeout(function(){ toast("⚠ "+T("ใช้ข้อมูลออฟไลน์ (เชื่อม Google Sheets ไม่ได้)","Offline cache — Sheets not reachable")+": "+_connErr,"err"); }, 600); }
    } else {
      showNoData();
    }
  });
}
boot();
/* ── refresh data from server (pull latest) ── */
async function hardReloadM(){
  if(!await __confirm(T("ล้างข้อมูลในเครื่องทั้งหมด แล้วโหลดใหม่จาก Server?\n(ข้อมูลที่ยังไม่ได้ซิงก์จะหาย)","Clear all local data and reload from server?")))return;
  var sb=document.getElementById("topSyncBtn"); if(sb)sb.classList.add("spin");
  toast(T("กำลังล้าง & โหลดจาก Server…","Clearing & reloading…"));
  loadFromServer().then(function(remote){
    if(remote&&remote.companies&&remote.companies.length){
      try{localStorage.removeItem(DB_KEY);}catch(e){}
      META=remote; try{localStorage.setItem(DB_KEY,JSON.stringify(META));}catch(e){}
      var cid=session.company; if(cid)activateCompany(cid); txnSeq=META.txnSeq||0;
      if(sb)sb.classList.remove("spin");
      toast(T("โหลดจาก Server แล้ว (ล้างแคชสำเร็จ)","Reloaded from server"),"ok"); go(CUR||"home");
    } else { if(sb)sb.classList.remove("spin"); toast(T("โหลดไม่สำเร็จ — เช็คเน็ต/Server ","Reload failed ")+(_connErr||""),"err"); }
  });
}
function syncNow(){
  var sb=document.getElementById("topSyncBtn"); if(sb)sb.classList.add("spin");
  toast(T("กำลังซิงก์…","Syncing…"));
  loadFromServer().then(function(remote){
    if(remote&&remote.companies&&remote.companies.length){
      var cid=session.company; META=remote; try{localStorage.setItem(DB_KEY,JSON.stringify(META));}catch(e){}
      if(cid)activateCompany(cid); txnSeq=META.txnSeq||0;
      toast(T("ซิงก์ข้อมูลแล้ว","Synced"),"ok"); go(CUR||"home");
    } else { if(sb)sb.classList.remove("spin"); toast(T("ซิงก์ไม่สำเร็จ","Sync failed"),"err"); }
  });
}
