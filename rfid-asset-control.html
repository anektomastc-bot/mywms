<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8720c">
<title>RFID Asset Control · CONST-WMS</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#e8720c;--orange2:#c2570a;--orange-grad:linear-gradient(135deg,#f0872a,#e8720c);
  --bg:#f4f2ee;--card:#ffffff;--ink:#1f2937;--sub:#6b7280;--sub2:#9ca3af;
  --line:#e7e1d6;--line2:#efeae1;--soft:#faf8f4;
  --ok:#22c55e;--okbg:#eafaf0;--danger:#ef4444;--warn:#f59e0b;--info:#0ea5e9;
  --shadow:0 2px 12px rgba(30,30,20,.06);--shadow2:0 8px 30px rgba(30,30,20,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior:none}
input,textarea,select{font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);display:flex;flex-direction:column}

/* ── Top bar ── */
.top{position:sticky;top:0;z-index:40;background:#241f18;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:9px}
.top .logo{width:34px;height:34px;border-radius:10px;background:#000;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.top .tt{flex:1;min-width:0;overflow:hidden}
.top .tt b{font-size:15px;font-weight:800;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.top .tt span{font-size:11px;color:rgba(255,255,255,.55);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topsync{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.topsync:active{transform:scale(.92)}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:2px;flex:0 0 auto}
.lang button{padding:5px 9px;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:800;color:rgba(255,255,255,.6)}
.lang button.on{background:var(--orange);color:#fff}
.syncnote{background:#eafaf0;color:#16a34a;font-size:11.5px;font-weight:700;padding:7px 16px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #d6f0e0}
.syncnote i{width:6px;height:6px;border-radius:50%;background:#22c55e;display:block}

/* ── Screen area ── */
main{flex:1;min-height:0;overflow-y:auto;position:relative}
.screen{padding:16px 16px 96px;animation:fade .2s}
.scan-main{flex:1;min-height:0;overflow:hidden;background:#15120e;color:#fff;display:flex;flex-direction:column;padding-bottom:90px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h1{font-size:22px;font-weight:900;margin-bottom:2px}
.sub{font-size:13px;color:var(--sub);margin-bottom:16px}
.sec-t{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:20px 4px 10px}
.backbtn{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--orange);margin-bottom:10px;padding:0}

/* ── Cards / rows ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row .rt,.more-row .rt{flex:1;min-width:0}
.row .rt b,.more-row .rt b{font-size:14.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt small,.more-row .rt small{font-size:12px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px;font-weight:900}
.thumb.ph{background:var(--soft);border:1px dashed #e0d8c8;color:#c9bfae}
.thumb.tint-ok{background:rgba(74,222,128,.16);color:#4ade80}
.thumb.tint-info{background:rgba(56,189,248,.16);color:#38bdf8}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.ok{background:var(--okbg);color:#16a34a}
.pill.warn{background:#fff7ed;color:#c2570a}
.pill.info{background:#e0f2fe;color:#0284c7}
.pill.ng{background:#f3f4f6;color:#6b7280}
.pill.danger{background:#fee2e2;color:#dc2626}

.progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--orange-grad);border-radius:6px}

/* ── Hero ── */
.hero{margin:-16px -16px 0;padding:16px 18px 24px;background:linear-gradient(160deg,#241f18 0%,#332a20 55%,#4a3a28 100%);border-radius:0 0 26px 26px;color:#fff;position:relative;box-shadow:0 6px 20px rgba(30,20,10,.18)}
.hero-date{position:absolute;top:16px;right:18px;font-size:11.5px;color:rgba(255,255,255,.5);text-align:right;line-height:1.5;font-weight:600}
.hero-greet{font-size:14px;font-weight:700;display:inline-block;background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,#f6c177 45%,#ffe6c0 55%,rgba(255,255,255,.4) 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 3.2s linear infinite}
@keyframes shimmer{0%{background-position:120% center}100%{background-position:-120% center}}
.hero-name{font-size:25px;font-weight:900;color:#fff;margin-top:3px;line-height:1.15}
.hero-name span{font-size:13px;font-weight:600;color:rgba(255,255,255,.45)}
.hero-stats{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:18px;margin-top:18px;overflow:hidden}
.hstat{flex:1;text-align:center;padding:15px 4px}
.hstat+.hstat{border-left:1px solid rgba(255,255,255,.08)}
.hstat .hv{font-size:23px;font-weight:900;color:#fff;line-height:1}
.hstat .hv.warn{color:#f5a623}
.hstat .hl{font-size:11px;color:rgba(255,255,255,.6);margin-top:5px}

.qa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:4px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--shadow)}
.qa button span{font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.qa button:active{transform:scale(.96)}

.inp{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;line-height:1.5;background:var(--card);color:var(--ink);outline:none}
.inp:focus{border-color:var(--orange)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:6px}
.btn{width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--orange-grad);color:#fff;box-shadow:0 6px 18px rgba(232,114,12,.3)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:linear-gradient(135deg,#4ade80,#22c55e);color:#fff}

.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.search input{padding-left:42px}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chips button{white-space:nowrap;padding:7px 15px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--sub)}
.chips button.on{background:var(--orange);color:#fff;border-color:var(--orange)}

/* ── Detail ── */
.photo-ph{height:168px;border-radius:14px 14px 0 0;background:var(--soft);border-bottom:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#c9bfae}
.photo-ph.sm{height:140px;border-radius:14px;border-bottom:none;margin-bottom:16px}
.photo-ph span{font-size:11.5px;font-weight:700}
.rfid-epc{margin-top:14px;padding:12px 14px;border-radius:14px;background:#241f18;color:#fff}
.rfid-epc .lbl{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.6px}
.rfid-epc .val{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;color:#f6c177;margin-top:5px;word-break:break-all}
.rfid-rssi{display:flex;align-items:center;gap:8px;margin-top:10px}
.rfid-rssi .track{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.rfid-rssi .track i{display:block;height:100%;background:#22c55e}
.rfid-rssi .val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
.rfid-qr{font-size:11px;color:rgba(255,255,255,.45);margin-top:6px}
.rfid-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;margin-top:14px}
.rfid-meta div{background:var(--card);padding:12px 13px}
.rfid-meta .k{font-size:10.5px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px}
.rfid-meta .v{font-size:13.5px;font-weight:700;margin-top:4px;color:var(--ink)}
.rfid-timeline{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:4px 16px}
.rfid-tl-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.rfid-tl-row:last-child{border-bottom:none}
.rfid-tl-date{flex:0 0 auto;width:40px;text-align:center}
.rfid-tl-date b{font-size:14px;font-weight:900;display:block}
.rfid-tl-date span{font-size:10px;font-weight:600;color:var(--sub2)}
.rfid-tl-bar{width:2px;background:var(--line2);flex:0 0 auto;border-radius:2px}
.rfid-tl-body b{font-size:13.5px;font-weight:700;display:block}
.rfid-tl-body small{font-size:12px;color:var(--sub)}
.rfid-actions{margin-top:16px;display:flex;gap:10px}
.rfid-actions .btn.ghost{flex:0 0 auto;width:auto;padding:14px 16px}

/* ── Audit ── */
.rfid-seg{display:flex;gap:6px;background:var(--line2);padding:4px;border-radius:14px;margin-bottom:14px}
.rfid-seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:12px;font-weight:800;color:var(--sub)}
.rfid-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.footnote{font-size:11.5px;line-height:1.6;color:var(--sub2);text-align:center;margin:10px 4px 0}

/* ── Register ── */
.reg-bars{display:flex;gap:6px;margin-bottom:18px}
.reg-bars i{flex:1;height:5px;border-radius:4px;background:var(--line);display:block}
.reg-bars i.on{background:var(--orange)}
.write-box{background:#241f18;border-radius:18px;padding:22px 18px;color:#fff;text-align:center}
.write-ic{width:96px;height:96px;margin:0 auto;border-radius:50%;background:rgba(232,114,12,.16);display:flex;align-items:center;justify-content:center;position:relative}
.write-ic .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(232,114,12,.45);animation:ping 1.3s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.write-t{font-size:17px;font-weight:800;margin-top:16px}
.write-s{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.55);margin-top:6px}
.write-epc{margin-top:18px;padding:12px;border-radius:12px;background:rgba(255,255,255,.07);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#f6c177;word-break:break-all}
.done-box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 18px;text-align:center}
.done-ic{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--okbg);display:flex;align-items:center;justify-content:center}
.done-t{font-size:18px;font-weight:900;margin-top:14px}
.done-s{font-size:13px;line-height:1.6;color:var(--sub);margin-top:5px}
.locscan{width:46px;flex:0 0 auto;border-radius:12px;background:var(--orange-grad);color:#fff;display:flex;align-items:center;justify-content:center;border:none}

/* ── Scan ── */
.scan-top{padding:14px 18px 0;display:flex;align-items:center;gap:10px}
.scan-top .exit{color:rgba(255,255,255,.7);font-size:14px;font-weight:700;padding:0}
.scan-top .mid{flex:1;text-align:center}
.scan-top .mid b{font-size:13.5px;font-weight:800;display:block}
.scan-top .mid span{font-size:11px;color:rgba(255,255,255,.45)}
.scan-top .badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;background:rgba(232,114,12,.18);color:#f0872a;white-space:nowrap}
.scan-hero{padding:16px 18px 6px;flex:0 0 auto}
.scan-hero-top{display:flex;align-items:flex-end;gap:10px}
.scan-hero-count{font-size:52px;font-weight:900;line-height:1;color:#fff}
.scan-hero-lbl{padding-bottom:6px}
.scan-hero-lbl b{font-size:13px;font-weight:700;color:rgba(255,255,255,.75);display:block}
.scan-hero-lbl span{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.4)}
.scan-progress{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px}
.scan-progress i{display:block;height:100%;background:var(--orange-grad)}
.scan-kpis{display:flex;gap:8px;margin-top:14px}
.scan-kpi{flex:1;border-radius:14px;padding:10px 12px}
.scan-kpi .v{font-size:20px;font-weight:900}
.scan-kpi .l{font-size:11px;font-weight:600;color:rgba(255,255,255,.55)}
.scan-list{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 4px}
.scan-list-t{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.stream-card{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;animation:blip .5s ease both}
@keyframes blip{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1)}100%{opacity:.25;transform:scale(1)}}
.stream-card .stt{flex:1;min-width:0}
.stream-card .stt b{font-size:13.5px;font-weight:700;display:block;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stream-card .stt small{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:rgba(255,255,255,.4)}
.stream-empty{text-align:center;padding:26px 16px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.4);white-space:pre-line}
.scan-foot{flex:0 0 auto;padding:10px 18px 22px;display:flex;align-items:center;gap:16px}
.scan-clear{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.7);font-size:11px;font-weight:700;flex:0 0 auto}
.scan-trigger{flex:1;height:64px;border-radius:32px;border:none;background:var(--orange-grad);color:#fff;font-size:15px;font-weight:900;box-shadow:0 8px 22px rgba(232,114,12,.45);display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .1s}
.scan-trigger.holding{transform:scale(.97)}
.scan-summary{width:52px;height:52px;border-radius:50%;background:#22c55e;border:none;color:#fff;font-size:11px;font-weight:800;box-shadow:0 6px 16px rgba(34,197,94,.35);flex:0 0 auto}

/* ── More ── */
.more-row{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line2)}
.more-row:last-child{border-bottom:none}
.more-ic{width:36px;height:36px;border-radius:11px;background:rgba(232,114,12,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:14px;font-weight:900;color:var(--orange)}
.more-arrow{color:var(--sub2);font-weight:800}
.conn-box{margin-top:14px;padding:14px 16px;border-radius:16px;background:#fff7ed;border:1px solid #f6d9b8}
.conn-box .t{font-size:13px;font-weight:800;color:var(--orange2)}
.conn-box .b{font-size:12.5px;color:#8a6240;margin-top:4px;white-space:pre-line;line-height:1.6}

/* ── Nav / sheet / toast ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:45;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:flex-end;
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub2);font-size:10px;font-weight:600;padding:4px 0}
.nav button.on{color:var(--orange)}
.nav .glyph{font-size:19px;line-height:1}
.nav .scanbtn{flex:0 0 auto;margin-top:-34px;padding:0}
.nav .scanbtn .circle{width:68px;height:68px;border-radius:50%;background:var(--orange-grad);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 8px 22px rgba(232,114,12,.45);border:4px solid var(--card)}
.nav .scanbtn .circle span{font-size:9px;font-weight:800;color:#fff}

.sheet-ov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{position:relative;width:100%;max-width:520px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 16px;display:block}
.sheet .sh-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet .sh-h .thumb{width:52px;height:52px}
.sheet .sh-h b{font-size:16px;font-weight:800;display:block}
.sheet .sh-h small{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sub)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);width:100%;text-align:left}
.opt:active{background:var(--soft)}
.opt .oi{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px;font-weight:900;color:#fff}
.opt b{font-size:14.5px;font-weight:800;display:block}
.opt small{font-size:12px;color:var(--sub)}

.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);z-index:200;background:#1f2937;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow2);max-width:86%;text-align:center;animation:fade .2s}
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<script>
const {
  useState,
  useEffect,
  useRef
} = React;
const ASSETS = [{
  id: 1,
  code: "IT-1042",
  cat: 1,
  name: {
    th: "MacBook Pro 14 — ฝ่ายบัญชี",
    en: "MacBook Pro 14 — Accounting"
  },
  epc: "3034 F4E9 8A21 0C4B 7710 42",
  status: "ok",
  home: "HQ-3F",
  room: {
    th: "ห้อง 302",
    en: "Room 302"
  },
  lastSeen: {
    th: "วันนี้ 09:14",
    en: "Today 09:14"
  },
  rssi: -46,
  qr: "QR-IT1042"
}, {
  id: 2,
  code: "IT-1043",
